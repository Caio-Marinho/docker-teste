<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Sistema de Gestão</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <nav>
        <a href="index.html">Cadastrar</a>
        <a href="list.html">Controle de Atividades</a>
    </nav>

    <div class="main-wrapper">
        <h1>Gerenciamento de Cadastro</h1>

        <div class="selector-container">
            <label for="form-selector">O que você deseja cadastrar?</label>
            <select id="form-selector">
                <option value="">Selecione uma categoria...</option>
                <option value="dept">Novo Departamento</option>
                <option value="user">Novo Usuário</option>
                <option value="task">Nova Tarefa (Atividade)</option>
            </select>
        </div>

        <!-- 1. DEPARTAMENTOS -->
        <section id="section-dept" class="hidden form-section">
            <h2>Cadastrar Departamento</h2>
            <div class="form-content">
                <div class="form-group">
                    <label>Nome do Departamento</label>
                    <input id="dept-name" placeholder="Ex: Financeiro, Marketing..." />
                </div>
                <button onclick="createDepartment()">Finalizar Cadastro</button>
            </div>
        </section>

        <!-- 2. USUÁRIOS -->
        <section id="section-user" class="hidden form-section">
            <h2>Cadastrar Usuário</h2>
            <div class="form-content">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input id="user-name" placeholder="Digite o nome..." />
                    
                    <label>E-mail Corporativo</label>
                    <input id="user-email" type="email" placeholder="exemplo@empresa.com" />
                    
                    <label>Data de Nascimento</label>
                    <input id="user-birth" type="date" />
                    
                    <label>Idade</label>
                    <input id="user-age" type="number" placeholder="0" />
                    
                    <label>Departamento de Alocação</label>
                    <select id="user-dept">
                        <option value="">Carregando opções...</option>
                    </select>
                </div>
                <button onclick="createUser()">Finalizar Cadastro</button>
            </div>
        </section>

        <!-- 3. TAREFAS -->
        <section id="section-task" class="hidden form-section">
            <h2>Cadastrar Nova Atividade</h2>
            <div class="form-content">
                <div class="form-group">
                    <label>Título da Atividade</label>
                    <input id="task-title" placeholder="O que precisa ser feito?" />
                    
                    <label>Descrição Detalhada</label>
                    <textarea id="task-desc" rows="3" placeholder="Detalhes da tarefa..."></textarea>
                    
                    <label>Colaborador Responsável</label>
                    <select id="task-user">
                        <option value="">Carregando opções...</option>
                    </select>

                    <label>Status Inicial</label>
                    <select id="task-status">
                        <option value="">Carregando opções...</option>
                    </select>
                </div>
                <button onclick="createTask()">Finalizar Cadastro</button>
            </div>
        </section>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/register.js"></script>
</body>
</html>
